[project]
name = "bib-deduplicator"
version = "0.1.0"
description = "Interactive BibTeX deduplicator with a themed GUI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["bibtexparser>=1.4,<2.0"]

[project.scripts]
bib-deduplicator = "bib_deduplicator:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"